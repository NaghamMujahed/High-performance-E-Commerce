version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3
    networks:
      - ecommerce-net

  app1:
    build: .
    environment:
      - SERVER_PORT=8080
    depends_on:
      - mysql
      - redis
    networks:
      - ecommerce-net

  app2:
    build: .
    environment:
      - SERVER_PORT=8080
    depends_on:
      - mysql
      - redis
    networks:
      - ecommerce-net

  app3:
    build: .
    environment:
      - SERVER_PORT=8080
    depends_on:
      - mysql
      - redis
    networks:
      - ecommerce-net

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecommerce
    ports:
      - "3307:3306"
    networks:
      - ecommerce-net

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - ecommerce-net

networks:
  ecommerce-net:
    driver: bridge