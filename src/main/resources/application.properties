spring.application.name=demo
server.port=${SERVER_PORT:8080}

# MySQL
spring.datasource.url=jdbc:mysql://mysql:3306/ecommerce
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Redis (Shared Sessions)
spring.session.store-type=redis
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# RabbitMQ
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Load Balancer (Backend Servers: name:port:weight)
backend.instances=${BACKEND_INSTANCES:app1:8080:1,app2:8080:3,app3:8080:1}

# Virtual Threads & Logging
spring.threads.virtual.enabled=true
logging.level.com.example.demo.aspect=INFO
logging.level.root=INFO